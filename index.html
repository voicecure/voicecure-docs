<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOICECURE WORKFLOW</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css" />
  <style>
    /* ✅ 인증 및 동의 모달 레이아웃 */
    #auth-container, #consent-container {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #111111;
      display: flex; justify-content: center; align-items: center;
      z-index: 999999;
    }
    .auth-card {
      background: #1e1e1e;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 420px;
      width: 90%;
      border: 1px solid #333333;
    }
    .auth-card-logo {
      width: 50px; height: 50px;
      margin: 0 auto 12px auto;
      background-image: url('COLOR2.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }
    .auth-btn {
      background-color: #3f51b5;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: background-color 0.2s ease;
    }
    .auth-btn:hover { background-color: #2e3b87; }

    .terms-box {
      background-color: #141414;
      border: 1px solid #333333;
      border-radius: 10px;
      padding: 15px;
      text-align: left;
      font-size: 12px;
      color: #cccccc;
      line-height: 1.6;
      max-height: 160px;
      overflow-y: auto;
      margin: 15px 0;
    }

    body { background-color: #1e1e1e; color: #f0f0f0; margin: 0; }
    .markdown-section { color: #f0f0f0; padding: 40px !important; }
    .markdown-section h1, .markdown-section h1 a { color: #4FC1FF !important; }
    .markdown-section h2, .markdown-section h2 a { color: #f4c66c !important; }
    .markdown-section h3, .markdown-section h3 a { color: #4FC1FF !important; }
    .markdown-section h4, .markdown-section h4 a { color: #f0f0f0 !important; }
    .markdown-section strong { color: #ffffff; }
    .sidebar { background-color: #111 !important; width: 360px !important; overflow-x: auto; }
    .sidebar ul li a { color: #cccccc !important; font-size: 14px !important; }
    .sidebar ul li.active > a { color: #ffffff !important; font-weight: bold; }
    .sidebar-app-name { font-size: 18px !important; font-weight: 700 !important; color: #ffffff !important; padding: 12px 8px !important; background-color: #111 !important; text-align: center; border-bottom: 1px solid #333; }
    .sidebar-app-name::before { content: ''; display: block; background-image: url('COLOR2.png'); background-size: contain; background-repeat: no-repeat; background-position: center; width: 60px; height: 60px; margin: 0 auto 8px auto; }
    .floating-logo { position: fixed; bottom: 24px; right: 24px; z-index: 999; width: 48px; height: 48px; border-radius: 50%; background-color: #1e1e1e; box-shadow: 0 0 10px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .floating-logo img { width: 28px; height: 28px; object-fit: contain; }
  </style>
</head>

<body>

  <!-- 1. 구글 인증 모달 -->
  <div id="auth-container">
    <div class="auth-card">
      <div class="auth-card-logo"></div>
      <h3 style="margin: 0 0 6px 0; font-weight:700; color:#ffffff;">VOICECURE</h3>
      <p style="color: #a0a0a0; font-size: 13px; margin: 0 0 20px 0;">워크플로우 시스템 보안 인증</p>
      <button id="btn-login" class="auth-btn" onclick="loginWithGoogle()">Google 계정으로 로그인</button>
      <p id="auth-error" style="color: #ff6b6b; font-size: 13px; margin-top: 15px; display: none; font-weight: 500;"></p>
    </div>
  </div>

  <!-- 2. 디지털 재화 약관 동의 모달 -->
  <div id="consent-container" style="display:none;">
    <div class="auth-card">
      <div class="auth-card-logo"></div>
      <h4 style="margin: 0 0 6px 0; font-weight:700; color:#f4c66c;">디지털 재화 열람 및 환불 규정 동의</h4>
      
      <div class="terms-box">
        1. 본 워크플로우 문서를 열람하는 즉시 디지털 재화의 이용이 개시된 것으로 간주됩니다.<br><br>
        2. 열람 후 향후 수강료 환불 요청 시, 해당 워크플로우 열람 이력에 따른 차감 규정이 적용됩니다.
      </div>

      <button class="auth-btn" onclick="submitConsentAndProceed()">동의하고 워크플로우 열람하기</button>
    </div>
  </div>

  <!-- 3. 문서 컨테이너 -->
  <div id="main-docs" style="display:none;">
    <div id="app"></div>
    <a href="https://voicecurepro.com" target="_blank" class="floating-logo">
      <img src="COLOR2.png" alt="VoiceCure Home" />
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAITzRfpj8xzQDgIYYcQBT2q-Q37u29Z_M",
      authDomain: "voicecure-workflow.firebaseapp.com",
      projectId: "voicecure-workflow",
      storageBucket: "voicecure-workflow.firebasestorage.app",
      messagingSenderId: "747600160872",
      appId: "1:747600160872:web:2be50f4afdb5e0de4e73dd",
      measurementId: "G-26Z9YKE4LX"
    };

    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtuxVmTxbaRsHKr-_5s8nc0k3OANROD7wlVZ14H60Zo91SA4edDG9QvK1kd1UYO5eUDg/exec";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUserData = null;

    window.loginWithGoogle = async function() {
      const errBox = document.getElementById('auth-error');
      if (errBox) errBox.style.display = 'none';
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        if (errBox) {
          errBox.innerText = "로그인 실패: " + error.message;
          errBox.style.display = 'block';
        }
      }
    };

    window.submitConsentAndProceed = async function() {
      if (!currentUserData) return;

      const userEmail = currentUserData.email.toLowerCase();
      // 브라우저 즉시 패스용 기기 기록 저장
      localStorage.setItem('vc_consented_' + userEmail, 'true');

      if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("여기에")) {
        try {
          await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: currentUserData.email,
              name: currentUserData.displayName || "미지정"
            })
          });
        } catch (e) {
          console.log("시트 기록 실패:", e);
        }
      }

      document.getElementById('consent-container').style.display = 'none';
      document.getElementById('main-docs').style.display = 'block';
      loadDocsifyEngine();
    };

    let isDocsifyLoaded = false;
    function loadDocsifyEngine() {
      if (isDocsifyLoaded) return;
      isDocsifyLoaded = true;

      window.$docsify = { name: '', loadSidebar: true, subMaxLevel: 1, basePath: '' };

      const scriptDocsify = document.createElement('script');
      scriptDocsify.src = "//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js";
      scriptDocsify.onload = () => {
        const scriptCollapse = document.createElement('script');
        scriptCollapse.src = "https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js";
        document.body.appendChild(scriptCollapse);

        const sidebarInterval = setInterval(() => {
          const sidebar = document.querySelector('.sidebar');
          if (sidebar && !document.querySelector('.sidebar-app-name')) {
            const logo = document.createElement('div');
            logo.className = 'sidebar-app-name';
            logo.innerText = 'VOICECURE WORKFLOW';
            sidebar.insertBefore(logo, sidebar.firstChild);
            clearInterval(sidebarInterval);
          }
        }, 100);
      };
      document.body.appendChild(scriptDocsify);
    }

    // ★ 실시간 동의 여부 검증 필터
    onAuthStateChanged(auth, async (user) => {
      const authContainer = document.getElementById('auth-container');
      const consentContainer = document.getElementById('consent-container');
      const mainDocs = document.getElementById('main-docs');
      const errBox = document.getElementById('auth-error');

      if (user) {
        const userEmail = user.email.toLowerCase();

        try {
          const response = await fetch(`${GAS_WEB_APP_URL}?email=${encodeURIComponent(userEmail)}`);
          const result = await response.json();

          if (result.allowed) {
            currentUserData = user;
            authContainer.style.display = 'none';

            const localConsented = localStorage.getItem('vc_consented_' + userEmail) === 'true';

            // ★ 시트 기록 또는 브라우저 기록 중 하나라도 동의 이력이 있으면 스킵
            if (result.consented || localConsented) {
              consentContainer.style.display = 'none';
              mainDocs.style.display = 'block';
              loadDocsifyEngine();
            } else {
              // 최초 동의가 필요한 사용자만 모달 표출
              consentContainer.style.display = 'flex';
            }
          } else {
            signOut(auth);
            if (errBox) {
              errBox.innerText = `[접근 거부] ${userEmail} 계정은 구매 등록되지 않았습니다.`;
              errBox.style.display = 'block';
            }
          }
        } catch (e) {
          signOut(auth);
          if (errBox) {
            errBox.innerText = "자격 확인 서버 통신 에러가 발생했습니다.";
            errBox.style.display = 'block';
          }
        }
      } else {
        authContainer.style.display = 'flex';
        consentContainer.style.display = 'none';
        mainDocs.style.display = 'none';
      }
    });
  </script>
</body>
</html>
